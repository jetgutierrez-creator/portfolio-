<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Messages | John Emerson T. Gutierrez</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070f'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' fill='%2338bdf8' text-anchor='middle'%3EJG%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05070f; --surface:rgba(148,178,255,.045); --surface-2:rgba(148,178,255,.07);
    --border:rgba(148,178,255,.13); --border-strong:rgba(148,178,255,.28);
    --text:#e9edf7; --muted:#98a2ba; --accent:#38bdf8;
    --accent-soft:rgba(56,189,248,.12); --accent-ring:rgba(56,189,248,.35);
    --grad:linear-gradient(120deg,#7dd3fc,#38bdf8 45%,#818cf8);
    --danger:#f87171; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
  ::selection{background:rgba(56,189,248,.35)}
  .glow{position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none}
  .g1{width:520px;height:520px;background:rgba(56,189,248,.08);top:-160px;right:-120px}
  .g2{width:460px;height:460px;background:rgba(99,102,241,.08);bottom:-160px;left:-140px}

  header{position:sticky;top:0;z-index:50;background:rgba(5,7,15,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .bar{max-width:1060px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .logo{font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--text)}
  .logo em{font-style:normal;color:var(--accent)}
  .bar .crumb{font-size:.82rem;color:var(--muted);font-weight:600}
  .bar-actions{display:flex;gap:10px}
  button{font:inherit;cursor:pointer;border:none}
  .btn-sm{padding:9px 18px;border-radius:10px;font-size:.82rem;font-weight:700;transition:transform .25s var(--ease),background .3s,border-color .3s;
    background:var(--accent-soft);border:1px solid var(--accent-ring);color:var(--accent)}
  .btn-sm:hover{transform:translateY(-2px);background:rgba(56,189,248,.2)}
  .btn-sm.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35);color:#fca5a5}
  .btn-sm.danger:hover{background:rgba(248,113,113,.18)}

  main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:44px 24px 90px}

  /* ---- login ---- */
  .login-wrap{min-height:calc(100vh - 190px);display:flex;align-items:center;justify-content:center}
  .login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;
    box-shadow:0 24px 60px rgba(2,6,23,.6)}
  .login-card .lock{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent-ring);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .login-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-.4px}
  .login-card .sub{color:var(--muted);font-size:.88rem;margin:8px 0 26px}
  .field label{display:block;font-size:.7rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .field{margin-bottom:16px}
  .field input{width:100%;background:rgba(8,13,28,.65);border:1px solid var(--border);border-radius:12px;color:var(--text);
    font:inherit;font-size:.94rem;padding:13px 16px;outline:none;transition:border-color .3s,box-shadow .3s}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(56,189,248,.12)}
  .login-error{display:none;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);color:#fca5a5;
    border-radius:12px;padding:11px 14px;font-size:.85rem;margin-bottom:16px}
  .btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--grad);color:#04121f;font-weight:800;font-size:.95rem;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .3s var(--ease),box-shadow .3s}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(56,189,248,.3)}
  .btn-primary:disabled{opacity:.7;cursor:not-allowed;transform:none}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(4,18,31,.35);border-top-color:#04121f;display:none;animation:spin .7s linear infinite}
  .loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- dashboard ---- */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
  .dash-head h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.5px}
  .dash-head h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{display:flex;gap:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;text-align:center}
  .stat b{font-size:1.3rem;display:block}
  .stat small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:1.4px}

  .msg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px;
    transition:border-color .3s}
  .msg:hover{border-color:var(--border-strong)}
  .msg-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .msg-head h3{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .msg-email{display:inline-block;font-size:.84rem;color:var(--accent);text-decoration:none;margin-bottom:6px}
  .msg-email:hover{text-decoration:underline}
  .msg-time{font-size:.76rem;color:var(--muted);white-space:nowrap;padding-top:3px}
  .badge{font-size:.66rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:999px;padding:3px 11px}
  .badge.unread{background:var(--accent-soft);border:1px solid var(--accent-ring);color:var(--accent)}
  .badge.read{background:rgba(148,178,255,.08);border:1px solid var(--border);color:var(--muted)}
  .badge.replied{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:#34d399}
  .msg-subject{font-size:.92rem;font-weight:700;margin-bottom:6px}
  .msg-subject span{color:var(--muted);font-weight:600}
  .msg-body{color:#c6ccdd;font-size:.92rem;white-space:pre-wrap;background:rgba(8,13,28,.5);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;margin:10px 0 16px}
  .msg-actions{display:flex;gap:10px;flex-wrap:wrap}
  .msg-actions button{padding:8px 16px;border-radius:9px;font-size:.78rem;font-weight:700;
    background:var(--accent-soft);border:1px solid var(--accent-ring);color:var(--accent);transition:background .25s,transform .25s}
  .msg-actions button:hover{background:rgba(56,189,248,.2);transform:translateY(-2px)}
  .msg-actions button:disabled{opacity:.35;cursor:default;transform:none}
  .msg-actions button.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35);color:#fca5a5}
  .msg-actions button.danger:hover{background:rgba(248,113,113,.18)}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:3rem;margin-bottom:14px}
  .empty p{font-size:.95rem}

  #toasts{position:fixed;top:82px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(340px,calc(100vw - 44px))}
  .toast{background:rgba(8,13,28,.96);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:14px;
    padding:13px 16px;font-size:.86rem;box-shadow:0 18px 44px rgba(2,6,23,.65);transform:translateX(120%);opacity:0;
    transition:transform .45s var(--ease),opacity .45s}
  .toast.show{transform:none;opacity:1}
  .toast.error{border-left-color:var(--danger)}

  @media(max-width:640px){
    .dash-head{margin-bottom:20px}
    .bar .crumb{display:none}
  }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<header>
  <div class="bar">
    <a href="/" class="logo">JEG<em>.</em></a>
    <span class="crumb">Admin — Message Inbox</span>
    <div class="bar-actions">
      <a href="/" class="btn-sm" style="text-decoration:none;display:inline-flex;align-items:center">← Portfolio</a>
      <button class="btn-sm danger" id="logoutBtn" hidden>Log out</button>
    </div>
  </div>
</header>

<main>
  <!-- =============== LOGIN =============== -->
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="lock">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Admin Login</h1>
      <p class="sub">Sign in to view and manage your portfolio messages.</p>
      <p class="login-error" id="loginError"></p>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <span class="label">Sign In</span><span class="spinner"></span>
      </button>
    </form>
  </div>

  <!-- =============== DASHBOARD =============== -->
  <div id="dashView" hidden>
    <div class="dash-head">
      <div>
        <h1>Message <span>Inbox</span></h1>
        <p style="color:var(--muted);font-size:.88rem">Messages sent through your portfolio contact form.</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><small>Total</small></div>
        <div class="stat"><b id="statUnread" style="color:var(--accent)">0</b><small>Unread</small></div>
        <button class="btn-sm" id="refreshBtn" style="align-self:center">↻ Refresh</button>
      </div>
    </div>
    <div id="msgList"></div>
  </div>
</main>

<div id="toasts" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const loginView = $('loginView'), dashView = $('dashView');
const loginForm = $('loginForm'), loginBtn = $('loginBtn'), loginError = $('loginError');
const msgList = $('msgList'), logoutBtn = $('logoutBtn');

function toast(msg, isErr = false){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' error' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500); }, 4200);
}

async function api(url, options = {}){
  const res = await fetch(url, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401 && !url.endsWith('/login')){ showLogin(); throw new Error('unauthorized'); }
  return { ok: res.ok, status: res.status, ...json };
}

function showLogin(){ loginView.hidden = false; dashView.hidden = true; logoutBtn.hidden = true; }
function showDash(){ loginView.hidden = true; dashView.hidden = false; logoutBtn.hidden = false; loadMessages(); }

/* ---------------- login ---------------- */
loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  loginError.style.display = 'none';
  loginBtn.disabled = true; loginBtn.classList.add('loading');
  try {
    const r = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
    });
    if (r.ok){ showDash(); loginForm.reset(); }
    else { loginError.textContent = r.error || 'Login failed.'; loginError.style.display = 'block'; }
  } catch {
    loginError.textContent = 'Could not reach the server. Is it running?';
    loginError.style.display = 'block';
  } finally {
    loginBtn.disabled = false; loginBtn.classList.remove('loading');
  }
});

logoutBtn.addEventListener('click', async () => {
  try { await api('/api/admin/logout', { method: 'POST' }); } catch {}
  showLogin();
});

/* ---------------- messages ---------------- */
const STATUS_LABEL = { unread: 'Unread', read: 'Read', replied: 'Replied' };

async function loadMessages(){
  msgList.innerHTML = '';
  let data;
  try { data = await api('/api/admin/messages'); }
  catch { return; }
  if (!data.ok){ toast(data.error || 'Could not load messages.', true); return; }

  const msgs = data.messages || [];
  $('statTotal').textContent = msgs.length;
  $('statUnread').textContent = msgs.filter(m => m.status === 'unread').length;

  if (!msgs.length){
    const d = document.createElement('div');
    d.className = 'empty';
    const big = document.createElement('div'); big.className = 'big'; big.textContent = '📭';
    const p = document.createElement('p'); p.textContent = 'No messages yet. When someone uses your contact form, they will appear here.';
    d.append(big, p); msgList.appendChild(d); return;
  }

  msgs.forEach(m => msgList.appendChild(renderMessage(m)));
}

function renderMessage(m){
  const card = document.createElement('article');
  card.className = 'msg';

  const head = document.createElement('div'); head.className = 'msg-head';
  const left = document.createElement('div');
  const h3 = document.createElement('h3');
  h3.appendChild(document.createTextNode(m.name + ' '));
  const badge = document.createElement('span');
  badge.className = 'badge ' + m.status;
  badge.textContent = STATUS_LABEL[m.status] || m.status;
  h3.appendChild(badge);
  const mail = document.createElement('a');
  mail.className = 'msg-email'; mail.href = 'mailto:' + m.email; mail.textContent = m.email;
  left.append(h3, mail);
  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = new Date(m.created_at).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
  head.append(left, time);

  const subject = document.createElement('p');
  subject.className = 'msg-subject';
  const sLabel = document.createElement('span'); sLabel.textContent = 'Subject: ';
  subject.append(sLabel, document.createTextNode(m.subject));

  const body = document.createElement('p');
  body.className = 'msg-body'; body.textContent = m.message;

  const actions = document.createElement('div'); actions.className = 'msg-actions';
  const mk = (label, status, isDanger) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (isDanger) b.className = 'danger';
    if (status && m.status === status) b.disabled = true;
    b.addEventListener('click', () => handleAction(m.id, status, b, isDanger));
    return b;
  };
  actions.append(mk('Mark as Read', 'read'), mk('Mark as Replied', 'replied'), mk('Delete', null, true));

  card.append(head, subject, body, actions);
  return card;
}

async function handleAction(id, status, btn, isDelete){
  if (isDelete && !confirm('Delete this message permanently?')) return;
  btn.disabled = true;
  try {
    const r = isDelete
      ? await api('/api/admin/messages/' + id, { method: 'DELETE' })
      : await api('/api/admin/messages/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
    if (r.ok){ toast(isDelete ? 'Message deleted.' : 'Message updated.'); loadMessages(); }
    else { toast(r.error || 'Action failed.', true); btn.disabled = false; }
  } catch { toast('Connection problem. Try again.', true); btn.disabled = false; }
}

$('refreshBtn').addEventListener('click', loadMessages);

/* On load: if a session already exists, go straight to the dashboard */
(async () => {
  try {
    const r = await fetch('/api/admin/messages', { credentials: 'same-origin' });
    if (r.ok) showDash(); else showLogin();
  } catch { showLogin(); }
})();
</script>
</body>
</html>
